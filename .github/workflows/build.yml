name: Build & Release

# Tests the app, builds Windows and Linux executables and attaches them to a
# GitHub Release. Releases are triggered by pushing a "v*" tag (e.g. v1.1.0).
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to create the Release and upload files

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System dependencies (Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

  build:
    needs: test
    # Build only for tags or manual runs.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RDDownloader-windows.exe
            built: dist/RDDownloader.exe
          # 22.04 = older glibc, so the binary runs on more distros.
          - os: ubuntu-22.04
            artifact: RDDownloader-linux
            built: dist/RDDownloader
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RDDownloader --icon assets/icon.ico rddownloader.py

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.artifact }}"

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.artifact }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload as artifact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}

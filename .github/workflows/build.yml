name: Build & Release

# Testa, compila o programa para Windows e Linux e anexa os executáveis ao
# Release. Dispara ao enviar uma tag começando com "v" (ex.: v1.1.0).
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

permissions:
  contents: write  # necessário para criar o Release e anexar arquivos

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências de sistema (Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

  build:
    needs: test
    # Compila só em tags ou quando disparado manualmente.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RDDownloader-windows.exe
            built: dist/RDDownloader.exe
          # 22.04 = glibc mais antiga, o binário roda em mais distros.
          - os: ubuntu-22.04
            artifact: RDDownloader-linux
            built: dist/RDDownloader
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0

      - name: Compilar com PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RDDownloader --icon assets/icon.ico rddownloader.py

      - name: Preparar artefato
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.artifact }}"

      - name: Anexar ao Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.artifact }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Publicar como artifact (execução manual)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
